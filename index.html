<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Practise job interviews out loud with an AI interviewer. Get STAR feedback, filler-word counts and better versions of your answers.">
<title>Interview Coach</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: one narrow mobile column (max 560px) for setup and report; the
   interview room is a dark two-panel "video call" in the same column. */
:root {
  --bg: #f5f4ec;
  --surface: #eeede2;
  --surface-2: #e3e2d2;
  --line: #d4d3c1;
  --ink: #1b2112;
  --ink-2: #5a6150;
  --accent: #46691f;
  --accent-ink: #ffffff;
  --accent-soft: #c9dfa3;
  --accent-softer: #e3edd0;
  --mint: #d6eee2;
  --amber: #8a5a12;
  --amber-soft: #f4e5c6;
  --danger: #a3361f;
  --focus: #2f6fdb;
  /* the interview room keeps one dark look in both themes, like a video call */
  --room: #15171c;
  --room-2: #22252d;
  --room-3: #2d313b;
  --room-ink: #f1f2ee;
  --room-ink-2: #a9adb6;
  --room-accent: #b9dd8a;
  --font: "Figtree", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --r: 18px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121410; --surface: #1a1d16; --surface-2: #272b21; --line: #363b2d; --ink: #edefe5; --ink-2: #a6ac99;
    --accent: #93c35a; --accent-ink: #10140a; --accent-soft: #34491c; --accent-softer: #222d16; --mint: #1c3a2c;
    --amber: #e3b25e; --amber-soft: #3a2d14; --danger: #ef8a6f; --focus: #7aa7ff; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #121410; --surface: #1a1d16; --surface-2: #272b21; --line: #363b2d; --ink: #edefe5; --ink-2: #a6ac99;
  --accent: #93c35a; --accent-ink: #10140a; --accent-soft: #34491c; --accent-softer: #222d16; --mint: #1c3a2c;
  --amber: #e3b25e; --amber-soft: #3a2d14; --danger: #ef8a6f; --focus: #7aa7ff; color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { min-height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 400 16px/1.5 var(--font); -webkit-font-smoothing: antialiased; }
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
button:disabled { cursor: not-allowed; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
h1, h2, h3 { text-wrap: balance; margin: 0; }
p { margin: 0; }
.num { font-variant-numeric: tabular-nums; }

#app { max-width: 560px; margin: 0 auto; padding-inline: 16px; padding-block: 20px 40px; }

/* ---------- Shared pieces ---------- */
.eyebrow { font-size: 13px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: var(--accent); }
.lede { color: var(--ink-2); font-size: 17px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 52px; padding: 0 22px; border-radius: 999px; border: 0; font-weight: 700; font-size: 17px; }
.btn.primary { background: var(--accent); color: var(--accent-ink); width: 100%; min-height: 60px; font-size: 18px; }
.btn.primary:disabled { opacity: 0.45; }
.btn.soft { background: var(--accent-softer); color: var(--ink); }
.btn.ghost { background: transparent; color: var(--ink-2); border: 1.5px solid var(--line); }
.btn.small { min-height: 40px; padding: 0 16px; font-size: 15px; }
.card { background: var(--surface); border-radius: var(--r); padding: 20px; }
.stack { display: grid; gap: 14px; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.muted { color: var(--ink-2); }
.small { font-size: 14px; }
.icon { width: 22px; height: 22px; flex: none; }

/* ---------- Setup ---------- */
.setup { display: grid; gap: 22px; }
.setup-top { display: flex; align-items: center; gap: 14px; }
.back { width: 52px; height: 52px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); display: grid; place-items: center; flex: none; }
.back:disabled { opacity: 0.4; }
.progress { flex: 1; display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.progress span { height: 6px; border-radius: 6px; background: var(--surface-2); }
.progress span.on { background: var(--accent); }
.setup h1 { font-size: clamp(28px, 7vw, 36px); line-height: 1.15; font-weight: 800; letter-spacing: -0.01em; }
.field { display: grid; gap: 8px; }
.field label { font-weight: 600; }
.input { width: 100%; min-height: 56px; padding: 12px 16px; border-radius: 14px; border: 1.5px solid var(--line); background: var(--surface); font-size: 17px; }
.input:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 3px var(--accent-soft); }
textarea.input { min-height: 120px; resize: vertical; line-height: 1.5; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { border: 1.5px solid var(--line); background: transparent; border-radius: 999px; padding: 7px 14px; font-size: 15px; font-weight: 500; color: var(--ink); }
.chip[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); }
details.jd summary { cursor: pointer; font-weight: 600; color: var(--accent); list-style: none; }
details.jd summary::-webkit-details-marker { display: none; }
details.jd[open] summary { margin-bottom: 10px; }

.options { display: grid; gap: 12px; }
.option { display: grid; grid-template-columns: 40px 1fr 28px; align-items: center; gap: 14px; width: 100%; text-align: left; padding: 18px 18px 18px 20px; border-radius: 22px; border: 2px solid transparent; background: var(--surface); }
.option[aria-checked="true"] { background: var(--accent-soft); border-color: var(--accent); }
.option strong { display: block; font-size: 18px; font-weight: 700; }
.option small { display: block; color: var(--ink-2); font-size: 15px; }
.radio { width: 28px; height: 28px; border-radius: 50%; border: 2px solid var(--ink-2); display: grid; place-items: center; }
.option[aria-checked="true"] .radio { border-color: var(--ink); background: var(--ink); }
.option[aria-checked="true"] .radio::after { content: ""; width: 10px; height: 10px; border-radius: 50%; background: var(--accent-soft); }
.bars { display: flex; align-items: flex-end; gap: 3px; height: 22px; }
.bars i { width: 6px; border-radius: 2px; background: var(--line); }
.bars i:nth-child(1) { height: 8px; } .bars i:nth-child(2) { height: 14px; } .bars i:nth-child(3) { height: 20px; }
.bars i.on { background: var(--ink); }

.perm { display: grid; grid-template-columns: 56px 1fr; gap: 16px; align-items: start; }
.perm-icon { width: 56px; height: 56px; border-radius: 16px; display: grid; place-items: center; background: var(--accent-soft); color: var(--ink); }
.perm h3 { font-size: 19px; font-weight: 700; }
.perm p { color: var(--ink-2); }
.perm b { color: var(--ink); }
.toggle-row { display: flex; align-items: center; justify-content: space-between; gap: 16px; border: 1.5px solid var(--line); border-radius: var(--r); padding: 16px 18px; }
.switch { width: 60px; height: 34px; border-radius: 999px; border: 0; background: var(--surface-2); position: relative; flex: none; }
.switch::after { content: ""; position: absolute; top: 4px; left: 4px; width: 26px; height: 26px; border-radius: 50%; background: #fff; transition: transform .2s; box-shadow: 0 1px 3px rgba(0,0,0,.25); }
.switch[aria-checked="true"] { background: var(--accent); }
.switch[aria-checked="true"]::after { transform: translateX(26px); }
.note { display: flex; gap: 10px; color: var(--ink-2); font-size: 14px; }
.quota { text-align: center; color: var(--ink-2); font-size: 15px; }
.quota b { color: var(--ink); }
.callout { border-radius: var(--r); padding: 14px 16px; background: var(--amber-soft); color: var(--ink); font-size: 15px; }
.callout.ok { background: var(--accent-softer); }
.resume { display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap; }

/* ---------- Green room (step 3) ---------- */
.preview { position: relative; aspect-ratio: 4 / 3; max-width: 100%; border-radius: 22px; overflow: hidden; background: var(--room); color: var(--room-ink-2); }
.preview video { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); display: block; }
.preview-off { position: absolute; inset: 0; display: grid; place-items: center; align-content: center; gap: 8px; font-size: 15px; text-align: center; padding: 16px; }
.preview-name { position: absolute; left: 12px; bottom: 12px; background: rgba(0,0,0,.55); color: #fff; font-size: 13px; font-weight: 600; padding: 3px 10px; border-radius: 999px; }
.mic-check { display: grid; gap: 8px; }
.mic-check .level { height: 10px; border-radius: 10px; background: var(--surface-2); overflow: hidden; }
.mic-check .level i { display: block; height: 100%; background: var(--accent); transform-origin: left; transform: scaleX(.03); transition: transform .08s linear; }
.mic-check p { display: flex; gap: 8px; align-items: center; color: var(--ink-2); }
.ok-dot, .warn-dot { width: 10px; height: 10px; border-radius: 50%; flex: none; background: var(--accent); }
.warn-dot { background: var(--amber); }

/* ---------- Interview call ---------- */
.call { position: relative; display: grid; grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(280px, 1fr) auto auto; border-radius: 24px; overflow: hidden; background: var(--room); color: var(--room-ink); min-height: min(880px, calc(100vh - 40px)); }
.call-top { display: flex; align-items: center; gap: 12px; padding: 14px 16px; }
.live-dot { width: 12px; height: 12px; border-radius: 50%; background: #4fd07a; box-shadow: 0 0 0 5px rgba(79,208,122,.18); flex: none; }
.who { min-width: 0; }
.who strong { display: block; font-size: 17px; line-height: 1.15; }
.who small { display: block; color: var(--room-ink-2); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.qdots { margin-left: auto; display: flex; gap: 6px; flex: none; }
.qdots i { width: 9px; height: 9px; border-radius: 9px; background: var(--room-3); transition: width .2s; }
.qdots i.done { background: var(--room-accent); }
.qdots i.now { width: 26px; background: var(--room-ink); }
.timer { font-size: 14px; color: var(--room-ink-2); background: var(--room-2); border-radius: 999px; padding: 3px 10px; flex: none; }
.stage { position: relative; display: grid; place-items: center; align-content: center; gap: 8px; padding: 16px; background: radial-gradient(110% 90% at 50% 30%, #2b313d 0%, var(--room) 72%); }
.avatar { width: min(240px, 56vw); aspect-ratio: 1; max-width: 100%; }
.avatar svg { width: 100%; height: 100%; display: block; }
.stage[data-hearing="true"] .avatar { animation: nod 1.6s ease-in-out infinite; }
@keyframes nod { 0%, 100% { transform: translateY(0) rotate(0); } 30% { transform: translateY(3px) rotate(-1deg); } 60% { transform: translateY(-1px) rotate(.5deg); } }
.mouth { transform-origin: 120px 133px; transform-box: view-box; transition: transform .08s; }
.stage[data-speaking="true"] .mouth { animation: talk .3s ease-in-out infinite alternate; }
.stage[data-word="true"] .mouth { transform: scaleY(1.6); }
@keyframes talk { from { transform: scaleY(.55); } to { transform: scaleY(1.3); } }
.eyes { animation: blink 5s infinite; transform-origin: 120px 110px; transform-box: view-box; }
@keyframes blink { 0%, 95%, 100% { transform: scaleY(1); } 97% { transform: scaleY(.1); } }
.wave { display: flex; gap: 4px; align-items: center; height: 26px; opacity: 0; transition: opacity .2s; }
.stage[data-speaking="true"] .wave { opacity: 1; }
.wave i { width: 5px; height: 6px; border-radius: 4px; background: var(--room-accent); }
.stage[data-speaking="true"] .wave i { animation: bar .8s ease-in-out infinite; }
.wave i:nth-child(2n) { animation-delay: -.2s !important; } .wave i:nth-child(3n) { animation-delay: -.45s !important; } .wave i:nth-child(5n) { animation-delay: -.6s !important; }
@keyframes bar { 0%, 100% { height: 5px; } 50% { height: 24px; } }
.self { position: absolute; top: 12px; right: 12px; width: 28%; min-width: 96px; max-width: 160px; aspect-ratio: 3 / 4; border-radius: 16px; overflow: hidden; background: var(--room-3); border: 2px solid rgba(255,255,255,.14); box-shadow: 0 0 0 calc(var(--lvl, 0) * 7px) rgba(185,221,138,.5), 0 8px 24px rgba(0,0,0,.35); transition: box-shadow .08s linear; }
.self video { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); display: block; }
.self-off { position: absolute; inset: 0; display: grid; place-items: center; align-content: center; gap: 4px; color: var(--room-ink-2); font-size: 13px; font-weight: 600; }
.self-mic { position: absolute; left: 8px; bottom: 8px; width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; background: rgba(0,0,0,.55); color: #fff; }
.side-col { display: grid; align-content: start; }
.captions { display: grid; gap: 10px; padding: 12px 16px 0; }
.cap-q { background: var(--room-2); border: 1px solid var(--room-3); border-radius: 20px; padding: 14px 18px; }
.cap-q .eyebrow { color: var(--room-accent); font-size: 12px; }
.cap-q p:last-child { font-size: 19px; line-height: 1.4; margin-top: 4px; }
.transcript { background: rgba(255,255,255,.04); border: 1px solid var(--room-3); border-radius: 16px; padding: 12px 16px; min-height: 52px; max-height: 140px; overflow-y: auto; font-size: 17px; line-height: 1.45; }
.transcript .ph { color: var(--room-ink-2); font-style: italic; }
.transcript .interim { color: var(--room-ink-2); }
.panel-slot { padding: 10px 16px 0; display: grid; }
.panel-slot:empty { padding: 0; }
.panel { background: var(--room-2); border: 1px solid var(--room-3); border-radius: 18px; padding: 14px 16px; display: grid; gap: 12px; }
.panel h3 { font-size: 16px; }
.panel p { color: var(--room-ink-2); font-size: 15px; }
.panel .input { background: var(--room); border-color: var(--room-3); color: var(--room-ink); min-height: 110px; font-size: 16px; }
.panel .btn.soft { background: var(--room-3); color: var(--room-ink); }
.panel .btn.primary { background: var(--room-accent); color: #10140a; min-height: 48px; font-size: 16px; width: auto; flex: 1; }
.panel .btn.primary.end-now { background: #e5484d; color: #fff; }
.panel .btn.ghost { color: var(--room-ink); border-color: var(--room-3); }
.countdown { height: 4px; border-radius: 4px; background: var(--room-3); overflow: hidden; }
.countdown i { display: block; height: 100%; width: 100%; background: var(--room-accent); transform-origin: left; animation: shrink linear forwards; }
@keyframes shrink { to { transform: scaleX(0); } }
.callbar { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 12px; padding: 14px 16px 18px; }
.callbar .side { display: flex; gap: 10px; }
.callbar .end-side { justify-content: flex-end; }
.round { width: 52px; height: 52px; border-radius: 50%; border: 1px solid var(--room-3); background: var(--room-2); color: var(--room-ink); display: grid; place-items: center; }
.round[aria-pressed="false"] { background: var(--room-3); color: var(--room-ink-2); }
.round.end { background: #e5484d; border-color: #e5484d; color: #fff; width: 60px; border-radius: 999px; }
.mic-wrap { display: grid; justify-items: center; gap: 6px; }
.mic { width: 76px; height: 76px; border-radius: 50%; border: 0; display: grid; place-items: center; background: var(--room-3); color: var(--room-ink); transition: background .2s, transform .1s; }
.mic:active { transform: scale(.96); }
.mic[data-state="listening"] { background: #e3f0d3; color: #10140a; box-shadow: 0 0 0 8px rgba(185,221,138,.18); animation: pulse 1.6s ease-in-out infinite; }
@keyframes pulse { 50% { box-shadow: 0 0 0 14px rgba(185,221,138,.08); } }
.mic-label { color: var(--room-ink); font-size: 13px; font-weight: 600; min-height: 18px; text-align: center; white-space: nowrap; }
.menu { position: absolute; left: 16px; bottom: 100px; z-index: 5; background: var(--room-2); border: 1px solid var(--room-3); border-radius: 16px; padding: 6px; display: grid; min-width: 220px; box-shadow: 0 10px 30px rgba(0,0,0,.4); }
.menu button { text-align: left; background: none; border: 0; border-radius: 10px; padding: 11px 14px; color: var(--room-ink); font-size: 15px; }
.menu button:hover, .menu button:focus-visible { background: var(--room-3); }
@media (min-width: 720px) { .call { min-height: 840px; } .avatar { width: 260px; } }

/* ---------- Preparing report ---------- */
.prep { display: grid; gap: 18px; padding-block: 40px; }
.prep ol { list-style: none; padding: 0; margin: 0; display: grid; gap: 12px; }
.prep li { display: flex; gap: 12px; align-items: center; color: var(--ink-2); }
.prep li.done { color: var(--ink); }
.prep li .dot { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--line); flex: none; display: grid; place-items: center; }
.prep li.done .dot { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.prep li.now .dot { border-color: var(--accent); border-top-color: transparent; animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ---------- Report ---------- */
.report { display: grid; gap: 16px; }
.hero { border-radius: 28px; padding: 28px 22px; text-align: center; color: #fff; background: linear-gradient(150deg, #4c7524 0%, #5f8c2f 55%, #6f9e3a 100%); display: grid; gap: 14px; justify-items: center; }
.hero .eyebrow { color: rgba(255,255,255,.85); }
.ring { width: 180px; height: 180px; position: relative; }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring .val { position: absolute; inset: 0; display: grid; place-items: center; align-content: center; }
.ring .val b { font-size: 64px; line-height: 1; font-weight: 800; letter-spacing: -0.03em; }
.ring .val span { opacity: .8; font-size: 15px; }
.verdict { display: inline-block; background: rgba(255,255,255,.18); border-radius: 999px; padding: 4px 14px; font-weight: 700; font-size: 15px; }
.hero p.head { font-size: 18px; line-height: 1.45; max-width: 40ch; }
.section-title { font-size: 13px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--accent); margin-bottom: 12px; }
.streak { display: grid; gap: 12px; }
.streak .big { display: flex; align-items: baseline; gap: 10px; }
.streak .big b { font-size: 40px; line-height: 1; color: var(--accent); }
.days { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; text-align: center; font-size: 13px; color: var(--ink-2); }
.days i { display: block; height: 30px; border-radius: 9px; background: var(--surface-2); margin-top: 6px; }
.days i.on { background: var(--accent); }
.ranked { display: grid; gap: 10px; }
.rank { display: grid; grid-template-columns: 34px 1fr auto; gap: 12px; align-items: start; padding: 14px; border-radius: 16px; background: var(--bg); }
.rank .pos { font-weight: 800; font-size: 18px; color: var(--ink-2); }
.rank h4 { margin: 0 0 4px; font-size: 16px; font-weight: 600; line-height: 1.35; }
.rank .why { font-size: 14px; color: var(--ink-2); }
.score-pill { font-weight: 800; font-size: 18px; min-width: 52px; text-align: center; border-radius: 12px; padding: 4px 8px; }
.score-pill.hi { background: var(--accent-soft); } .score-pill.mid { background: var(--amber-soft); } .score-pill.lo { background: var(--surface-2); }
.tags { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; align-items: center; }
.tag { font-size: 12px; font-weight: 600; border-radius: 999px; padding: 2px 10px; background: var(--surface-2); color: var(--ink-2); }
.tag.best { background: var(--accent-soft); color: var(--ink); }
.tag.fix { background: var(--amber-soft); color: var(--ink); }
.consent { margin: 10px 2px 0; line-height: 1.45; }
.recording { display: grid; gap: 6px; }
.recording audio { width: 100%; height: 40px; }
.recording a { color: var(--room-ink-2); justify-self: start; }
.agent-notes { display: grid; gap: 6px; margin: 4px 0 8px; color: var(--ink-2); }
.agent-notes .tag { margin-right: 4px; }
.star { display: inline-flex; gap: 3px; }
.star b { width: 24px; height: 24px; border-radius: 7px; display: grid; place-items: center; font-size: 12px; background: var(--surface-2); color: var(--ink-2); }
.star b.present { background: var(--accent); color: var(--accent-ink); }
.star b.partial { background: var(--accent-soft); color: var(--ink); }
.meter { display: grid; gap: 6px; }
.meter .top { display: flex; justify-content: space-between; font-weight: 600; }
.meter .track { height: 14px; border-radius: 14px; background: var(--surface-2); overflow: hidden; }
.meter .fill { height: 100%; border-radius: 14px; background: linear-gradient(90deg, #44691d, #9bd162); }
.meters { display: grid; gap: 16px; }
.focus { display: grid; grid-template-columns: 52px 1fr; gap: 16px; align-items: start; }
.bulb { width: 52px; height: 52px; border-radius: 50%; background: var(--amber-soft); display: grid; place-items: center; color: var(--amber); }
.focus .eyebrow { color: var(--amber); }
.focus p { font-size: 18px; margin-top: 4px; }
.better { display: grid; gap: 12px; padding-block: 16px; border-top: 1px solid var(--line); }
.better:first-of-type { border-top: 0; padding-top: 0; }
.better h4 { margin: 0; font-size: 15px; color: var(--ink-2); font-weight: 600; }
.better h4 b { color: var(--ink); }
.said { border-left: 3px solid var(--line); padding-left: 14px; font-style: italic; color: var(--ink-2); }
.said mark { background: var(--amber-soft); color: var(--ink); border-radius: 4px; padding: 0 2px; font-style: normal; }
.model { background: var(--mint); border-radius: 16px; padding: 16px; font-size: 17px; line-height: 1.5; }
.model .ph { background: rgba(0,0,0,.08); border-radius: 4px; padding: 0 3px; font-weight: 600; }
.good li, .gaps li { margin-bottom: 6px; }
.good, .gaps { margin: 0; padding-left: 20px; }
.good li::marker { color: var(--accent); }
.numbers { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.numbers .wide { grid-column: 1 / -1; display: flex; justify-content: space-between; align-items: center; background: var(--accent-soft); }
.numbers > div { background: var(--bg); border-radius: 16px; padding: 14px; }
.numbers b { font-size: 28px; font-weight: 800; display: block; line-height: 1.1; }
.numbers .wide b { font-size: 40px; }
.numbers span { color: var(--ink-2); font-size: 14px; }
.fillers { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.skipped-q { display: flex; justify-content: space-between; gap: 12px; align-items: center; padding: 12px 0; border-top: 1px solid var(--line); }
.skipped-q:first-of-type { border-top: 0; }
.actions { display: grid; gap: 10px; }
.empty { text-align: center; color: var(--ink-2); padding: 24px; }
.footer-note { text-align: center; color: var(--ink-2); font-size: 13px; }

@media (min-width: 720px) {
  #app { padding-block: 40px 60px; }
}

/* ---------- Laptops and desktops ---------- */
@media (min-width: 1024px) {
  #app[data-view="setup"] { max-width: 640px; }
  #app[data-view="call"] { max-width: 1280px; padding-block: 24px; }
  #app[data-view="report"] { max-width: 1120px; }

  /* Call: the interviewer on the left, question / transcript / review on the right */
  .call {
    grid-template-columns: minmax(0, 1.4fr) minmax(380px, 1fr);
    grid-template-rows: auto minmax(0, 1fr) auto;
    grid-template-areas: "top top" "stage side" "bar side";
    height: calc(100vh - 48px); min-height: 640px;
  }
  .call-top { grid-area: top; padding: 16px 24px; border-bottom: 1px solid var(--room-3); }
  .stage { grid-area: stage; padding: 32px; }
  .avatar { width: min(360px, 32vw); }
  .self { top: 20px; right: 20px; width: 22%; max-width: 220px; }
  .callbar { grid-area: bar; padding: 18px 24px 22px; }
  .side-col { grid-area: side; border-left: 1px solid var(--room-3); background: rgba(255,255,255,.02); overflow-y: auto; padding-bottom: 20px; }
  .captions { padding: 20px 20px 0; gap: 14px; }
  .cap-q #cap-text { font-size: 22px; line-height: 1.4; }
  .transcript { max-height: 260px; min-height: 120px; }
  .panel-slot { padding: 14px 20px 0; }
  .menu { left: 24px; right: auto; }

  /* Report: two columns; long sections span both */
  .report { grid-template-columns: repeat(2, minmax(0, 1fr)); grid-auto-flow: row dense; align-items: start; gap: 20px; }
  .report > .hero, .report > .wide { grid-column: 1 / -1; }
  .report > .actions { max-width: 520px; justify-self: center; width: 100%; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
